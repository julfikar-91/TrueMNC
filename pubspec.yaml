name: true_corporate_job_finder
description: TrueMNC – True Corporate Job Finder Android App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  # State management & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.3.0

  # Auth
  google_sign_in: ^6.2.1

  # Storage & utils
  shared_preferences: ^2.3.2
  equatable: ^2.0.5
  intl: any

  # Freezed runtime
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  file_picker: ^13.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true        # enables l10n generation

  assets:
    - assets/images/
    - assets/icons/
